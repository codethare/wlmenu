name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # xkbcommon: smithay-client-toolkit's build script pkg-configs it, and the
      # runner image ships only the runtime library. The fonts are test fixtures:
      # the font tests look up a latin-only face and a CJK face by family name.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev fonts-noto-mono fonts-wqy-microhei
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
